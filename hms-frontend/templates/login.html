<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>HMS Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (replacement for Material Icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: #e8eaf6; /* preserved from your final style */
        }
        .login-card {
            margin-top: 8%;
        }

        /* Override primary button color to match your Indigo */
        .btn-primary {
            background-color: #3f51b5 !important;
            border-color: #3f51b5 !important;
        }

        /* Card background and title color */
        .card {
            background-color: #ffffff;
        }
        .card-title {
            color: #3f51b5;
        }

        /* Slightly smaller input-group icon width to look neat */
        .input-group-text {
            width: 44px;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card login-card shadow-sm">
                <div class="card-body">

                    <h4 class="card-title text-center mb-4">HMS Login</h4>

                    <form method="POST" novalidate>

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input id="username" name="username" type="text" class="form-control" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input id="password" name="password" type="password" class="form-control" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary">
                                Login
                                <i class="bi bi-send ms-1" aria-hidden="true"></i>
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
