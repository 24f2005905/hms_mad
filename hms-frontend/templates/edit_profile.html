<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Profile</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body { background: #e8eaf6; }
    .container-card { margin-top: 6%; }
    .btn-primary { background-color: #3f51b5 !important; border-color: #3f51b5 !important; }
    .card-title { color: #3f51b5; }
  </style>
</head>

<body>
  <div class="container container-card">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">

            <div class="d-flex align-items-center mb-3">
              <h4 class="card-title mb-0">Edit Profile</h4>
              <div class="ms-auto text-end small">
                <a href="{{ url_for('dashboard') }}" class="text-decoration-none">&larr; Back to dashboard</a>
              </div>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, msg in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'danger' else ('success' if category=='success' else 'info') }} alert-dismissible fade show" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- CLIENT-SIDE ALERT for JS validation -->
            <div id="pwAlert" class="alert alert-danger d-none"></div>

            <form method="POST" id="editForm" novalidate>

              <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">User ID</label>
                <div class="col-sm-9">
                  <input type="text" class="form-control-plaintext" readonly value="{{ user['User_ID'] }}">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="first_name" class="col-sm-3 col-form-label">First Name *</label>
                <div class="col-sm-9">
                  <input id="first_name" name="first_name" class="form-control" type="text"
                         value="{{ (form_values.first_name if form_values) or user['First_Name'] }}" required>
                </div>
              </div>

              <div class="mb-3 row">
                <label for="last_name" class="col-sm-3 col-form-label">Last Name</label>
                <div class="col-sm-9">
                  <input id="last_name" name="last_name" class="form-control" type="text"
                         value="{{ (form_values.last_name if form_values) or user['Last_Name'] or '' }}">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="phone_number" class="col-sm-3 col-form-label">Phone *</label>
                <div class="col-sm-9">
                  <input id="phone_number" name="phone_number" class="form-control" type="tel"
                         value="{{ (form_values.phone_number if form_values) or user['Phone_Number'] }}" required>
                  <div class="form-text">Digits only, optional +, 7–15 digits.</div>
                </div>
              </div>

              <!-- Password fields -->
              <div class="mb-3 row">
                <label for="cur_password" class="col-sm-3 col-form-label">Current Password</label>
                <div class="col-sm-9">
                  <input id="cur_password" name="cur_password" class="form-control" type="password"
                         placeholder="Leave blank to keep current password">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="new_password" class="col-sm-3 col-form-label">New Password</label>
                <div class="col-sm-9">
                  <input id="new_password" name="new_password" class="form-control" type="password"
                         placeholder="Leave blank to keep current password">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="cnf_password" class="col-sm-3 col-form-label">Confirm New Password</label>
                <div class="col-sm-9">
                  <input id="cnf_password" name="cnf_password" class="form-control" type="password"
                         placeholder="Leave blank to keep current password">
                </div>
              </div>

              <div class="text-end mt-4">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('editForm').addEventListener('submit', function (e) {
        let newPw = document.getElementById('new_password').value;
        let cnfPw = document.getElementById('cnf_password').value;
        let phone = document.getElementById('phone_number').value.trim();
        let alertBox = document.getElementById('pwAlert');

        // Reset styles and alerts
        alertBox.classList.add('d-none');
        document.getElementById('new_password').classList.remove('is-invalid');
        document.getElementById('cnf_password').classList.remove('is-invalid');
        document.getElementById('phone_number').classList.remove('is-invalid');

        // -------- PASSWORD MATCH VALIDATION --------
        if (!(newPw === "" && cnfPw === "")) {
            if (newPw !== cnfPw) {
                e.preventDefault();
                alertBox.textContent = "New password and Confirm password do not match.";
                alertBox.classList.remove('d-none');

                document.getElementById('new_password').classList.add('is-invalid');
                document.getElementById('cnf_password').classList.add('is-invalid');
                return false;
            }
        }

        // -------- PHONE NUMBER VALIDATION --------
        // Must be exactly 10 digits
        const phoneRegex = /^[0-9]{10}$/;

        if (!phoneRegex.test(phone)) {
            e.preventDefault();
            alertBox.textContent = "Phone number must be exactly 10 digits.";
            alertBox.classList.remove('d-none');

            document.getElementById('phone_number').classList.add('is-invalid');
            return false;
        }
    });
</script>


</body>
</html>
