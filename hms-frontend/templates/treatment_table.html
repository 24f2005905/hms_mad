
<style>
  /* Scroll area showing ~5 rows */
  .scroll-panel {
      max-height: 260px;  /* roughly 5 table rows; adjust if needed */
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
  }

  /* Make table header fixed */
  .scroll-panel table thead th {
      position: sticky;
      top: 0;
      background: #f8f9fa; /* same as .table-light */
      z-index: 2;
  }
</style>

<div class="scroll-panel">
  <table class="table table-bordered mb-0 align-middle">
    <thead class="table-light">
      <tr>
        <th style="width: 6%; text-align: center;">SL No.</th>
        <th style="text-align: center;">Appointment Date</th>
        <th style="text-align: center;">Doctor</th>
        <th style="text-align: center;">Speciality</th>
        <th style="width: 10%; text-align: center;">View Details</th>
      </tr>
    </thead>

    <tbody>
      {% if treatments %}
        {% for t in treatments %}
          <tr>
            <td style="text-align: center;">{{ loop.index }}</td>
            <td style="text-align: center;">{{ t.appointment_date }}</td>
            <td style="text-align: center;"><a href="{{ url_for('Doctor_Profile',User_ID = t.doctor_id) }}" class="text-decoration-none">
              {{ t.doctor_first_name }} {{ t.doctor_last_name }}
            </a></td>
            <td style="text-align: center;">{{ t.specialities }}</td>
            <td class="text-center">
              <a href="{{ url_for('treatment_detail', Appointment_ID=t.appointment_id, Patient_ID=t.patient_id) }}"
                 class="btn btn-sm btn-outline-primary">
                View
              </a>
            </td>
          </tr>
        {% endfor %}
      {% else %}
        <tr>
          <td colspan="6" class="text-center text-muted">No treatment history available.</td>
        </tr>
      {% endif %}
    </tbody>
  </table>
</div>
