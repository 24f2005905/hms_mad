{% extends "base.html" %}

{% block content %}
<div class="panel-card p-3">
  <h4>Delete User</h4>
  <div class="mb-3">
    <p><strong>Name:</strong> {{ First_Name }} {{ Last_Name }}<br>
       <strong>User_ID:</strong> {{ User_ID }}<br></p>
  </div>

  <div class="alert alert-warning">
    Are you sure you want to delete this user?
  </div>

  <form method="POST" action="{{ url_for('Delete_User', User_ID=User_ID) }}">
    <!-- Checkbox to optionally cancel appointments -->
    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" name="cancel_appointments" id="cancelAppointments">
      <label class="form-check-label" for="cancelAppointments">
        Cancel all appointments before deleting
      </label>
    </div>

    <button type="submit" class="btn btn-danger">Yes — Delete User</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">No — Keep User</a>
  </form>
</div>
{% endblock %}
