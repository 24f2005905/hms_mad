<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Registration Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Optional icons CSS if you use icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background: #e8eaf6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .card {
      background-color: #ffffff;
      border: none;
      border-radius: 0.375rem;
    }
    .card-body {
      padding: 2rem;
      text-align: center;
    }
    .shadow-sm {
      box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
    }
    .card-title {
      color: #3f51b5;
      margin-bottom: 1.5rem;
    }
    .btn-primary {
      background-color: #3f51b5 !important;
      border-color: #3f51b5 !important;
    }
    .mt-3 {
      margin-top: 1rem !important;
    }
  </style>
</head>
<body>

<div class="container-card">
  <div class="card shadow-sm mt-3">
    <div class="card-body">

      <h4 class="card-title">Registration Successful</h4>

      <p class="mb-4">
        <strong>Registration Success!</strong><br>
        Here is your User ID: <strong>{{ User_ID }}</strong>
      </p>
      {% if User_Type == 'ADMIN' %}
       <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
       {% endif %}
      
      <a href="{{ url_for('login') }}" class="btn btn-primary">Back to Login</a>
    

    </div>
  </div>
</div>

</body>
</html>
