<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMS Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (optional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background: #e8eaf6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container-card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background-color: #ffffff;
      border: none;
      border-radius: 0.375rem;
    }
    .card-body {
      padding: 2rem;
    }
    .shadow-sm {
      box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
    }
    .card-title {
      color: #3f51b5;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .btn-primary {
      background-color: #3f51b5 !important;
      border-color: #3f51b5 !important;
    }
    .form-text {
      font-size: 0.875rem;
      color: #6c757d;
    }
    .mt-3 { margin-top: 1rem !important; }
    .ms-2 { margin-left: 0.5rem !important; }
    .is-invalid {
      border-color: #dc3545 !important;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      padding: 0.75rem 1.25rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container-card">
  <div class="card register-card shadow-sm mt-3">
    <div class="card-body">

      <h4 class="card-title mb-4">Register</h4>

      <!-- Placeholder for server-side or client-side error alert -->
      <div id="formAlert" class="alert alert-danger d-none"></div>

      <form method="POST" id="regForm" novalidate>

        <div class="mb-3 row">
          <label for="first_name" class="col-sm-3 col-form-label">First Name</label>
          <div class="col-sm-9">
            <input id="first_name" name="First_Name" class="form-control" type="text" required>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="last_name" class="col-sm-3 col-form-label">Last Name</label>
          <div class="col-sm-9">
            <input id="last_name" name="Last_Name" class="form-control" type="text">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Gender</label>
          <div class="col-sm-9">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="Sex" id="gender_male" value="Male" required>
              <label class="form-check-label" for="gender_male">Male</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="Sex" id="gender_female" value="Female" required>
              <label class="form-check-label" for="gender_female">Female</label>
            </div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="date_of_birth" class="col-sm-3 col-form-label">Date Of Birth</label>
          <div class="col-sm-9">
            <input id="date_of_birth" name="Date_Of_Birth" class="form-control" type="date" required>
            <div class="form-text">Date of Birth (not future date)</div>
          </div>
        </div>

        


        <div class="mb-3 row">
          <label for="address" class="col-sm-3 col-form-label">Address</label>
          <div class="col-sm-9">
            <input id="address" name="Address" class="form-control" type="text" required>
            <div class="form-text">Current Residential Address</div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="phone_number" class="col-sm-3 col-form-label">Phone</label>
          <div class="col-sm-9">
            <input id="phone_number" name="Phone_Number" class="form-control" type="tel" required maxlength="10">
            <div class="form-text">Exactly 10 digits (Indian mobile)</div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="email_id" class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9">
            <input id="email_id" name="Email_ID" class="form-control" type="email" required>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="password" class="col-sm-3 col-form-label">Password</label>
          <div class="col-sm-9">
            <input id="password" name="password" class="form-control" type="password" required>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="cnf_password" class="col-sm-3 col-form-label">Confirm Password</label>
          <div class="col-sm-9">
            <input id="cnf_password" name="cnf_password" class="form-control" type="password" required>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary">Register</button>
          <a href="{{ url_for('login') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>

      </form>

    </div> <!-- card-body -->
  </div> <!-- card -->
</div>

<!-- Optional Bootstrap JS bundle (for things like alert close) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('regForm').addEventListener('submit', function(e) {
  const alertBox = document.getElementById('formAlert');
  alertBox.classList.add('d-none');
  alertBox.textContent = '';

  // --- PASSWORD MATCH CHECK ---
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('cnf_password').value;
  if (pw !== cpw) {
    e.preventDefault();
    alertBox.textContent = "Password and Confirm Password do not match.";
    alertBox.classList.remove('d-none');
    document.getElementById('password').classList.add('is-invalid');
    document.getElementById('cnf_password').classList.add('is-invalid');
    return false;
  }

  // --- PHONE NUMBER VALIDATION (Indian 10-digit mobile) ---
  const phone = document.getElementById('phone_number').value.trim();
  // Must be exactly 10 digits, starting with 6-9
  const phoneRegex = /^[6-9]\d{9}$/;
  if (!phoneRegex.test(phone)) {
    e.preventDefault();
    alertBox.textContent = "Please enter a valid 10-digit Indian mobile number (starts with 6–9).";
    alertBox.classList.remove('d-none');
    document.getElementById('phone_number').classList.add('is-invalid');
    return false;
  }

  // --- DATE OF BIRTH: Not future ---
  const dobInput = document.getElementById('date_of_birth').value;
  if (dobInput) {
    const dob = new Date(dobInput);
    const today = new Date();
    dob.setHours(0,0,0,0);
    today.setHours(0,0,0,0);
    if (dob > today) {
      e.preventDefault();
      alertBox.textContent = "Date of Birth cannot be in the future.";
      alertBox.classList.remove('d-none');
      document.getElementById('date_of_birth').classList.add('is-invalid');
      return false;
    }
  }

  // --- OPTIONAL: other checks (e.g. email pattern) ---

  // If all validations pass — allow submit.
});
</script>

</body>
</html>
