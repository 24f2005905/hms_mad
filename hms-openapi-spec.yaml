openapi: 3.0.3
info:
  title: HMS (Hospital Management System) API
  version: "1.0.0"
  description: |
    OpenAPI specification for the HMS endpoints described in the uploaded draft.
    Authentication uses an apiKey-style JWT passed in the Authorization header as "Bearer <token>".
  # reference to user's uploaded file (local path)
  x-source-file: "/mnt/data/rough-api-2.txt"
servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Local development
paths:

  /hms/user/create:
    post:
      summary: Create a new user
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "200":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/lookup:
    get:
      summary: Lookup user details
      tags: [Users]
      security:
        - JWT: []
      parameters:
        - name: User_ID
          in: query
          schema:
            type: string
        - name: Phone_Number
          in: query
          schema:
            type: string
        - name: First_name
          in: query
          schema:
            type: string
        - name: Last_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Found users / user details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/update:
    post:
      summary: Update user details
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/delete:
    delete:
      summary: Delete a user (and related data)
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDelete'
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointment/create:
    post:
      summary: Create appointment
      tags: [Appointments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        "200":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointments/lookup:
    get:
      summary: Lookup appointments
      tags: [Appointments]
      security:
        - JWT: []
      parameters:
        - name: Patient_ID
          in: query
          schema:
            type: string
        - name: Doctor_ID
          in: query
          schema:
            type: string
        - name: Appointment_ID
          in: query
          schema:
            type: string
        - name: Appointment_Status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Appointment(s) returned
          content:
            application/json:
              schema:
