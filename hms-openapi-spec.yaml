openapi: 3.0.3
info:
  title: HMS (Hospital Management System) API
  version: "1.0.0"
  description: |
    OpenAPI specification for the HMS endpoints described in the uploaded draft.
    Authentication uses an apiKey-style JWT passed in the Authorization header as "Bearer <token>".
  x-source-file: "/mnt/data/rough-api-2.txt"
servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Local development

# Global security requirement: JWT apiKey in Authorization header
security:
  - JWT: []

paths:
  /hms/id/generate/token:
    post:
      summary: Generate a JWT for a user
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCred'
      responses:
        "200":
          description: JWT created successfully
          content:
            application/json:
              schema:
                description: JWT Generation Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    token: 
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/create:
    post:
      summary: Create a new user
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "200":
          description: User created successfully
          content:
            application/json:
              schema:
                description: User Create Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    User_ID: 
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/lookup:
    get:
      summary: Lookup user details
      tags: [Users]
      security:
        - JWT: []
      parameters:
        - name: User_ID
          in: query
          schema:
            type: string
        - name: Phone_Number
          in: query
          schema:
            type: string
        - name: First_name
          in: query
          schema:
            type: string
        - name: Last_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Found users / user details
          content:
            application/json:
              schema:
                description : User Lookup Response
                type: object 
                properties:
                  status: 
                    $ref: '#/components/schemas/API-Status'
                  user_details:
                    type : array
                    items : 
                      $ref: '#/components/schemas/UserResponse'

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/update:
    post:
      summary: Update user details
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                description: Updated User Details
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    User_ID:
                      type: string
  
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/delete:
    delete:
      summary: Delete a user (and related data)
      tags: [Users]
      security:
        - JWT: []
      parameters:
        - in: query
          name: User_ID
          description: Delete by User_ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                description: User Deletion Response 
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    User_ID :
                      type: string 
             
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointment/create:
    post:
      summary: Create appointment
      tags: [Appointments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        "200":
          description: Appointment created
          content:
            application/json:
              schema:
                description: Appointment Create Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointments/lookup:
    get:
      summary: Lookup appointments
      tags: [Appointments]
      security:
        - JWT: []
      parameters:
        - name: Patient_ID
          in: query
          schema:
            type: string
        - name: Doctor_ID
          in: query
          schema:
            type: string
        - name: Appointment_ID
          in: query
          schema:
            type: string
        - name: Appointment_Date
          in: query
          schema:
            type: string
        - name: Appointment_Status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Appointment(s) returned
          content:
            application/json:
              schema:
                description: Appointment Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_details : 
                      type: array 
                      items: 
                        $ref: '#/components/schemas/AppointmentCreate'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointment/update:
    post:
      summary: Update appointment
      tags: [Appointments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                description : Updated Appointment Details
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointments/delete:
    delete:
      summary: Cancel / delete appointment
      tags: [Appointments]
      security:
        - JWT: []
      parameters:
        - in: query
          name: Appointment_ID
          description: Delete by Appointment_ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointment deleted
          content:
            application/json:
              schema:
                description: Appointment Deletion Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
                
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/upload:
    post:
      summary: Upload treatment (diagnosis/prescription)
      tags: [Treatments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentCreate'
      responses:
        "200":
          description: Treatment uploaded
          content:
            application/json:
              schema:
                description: Treatment Upload Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/lookup:
    post:
      summary: Lookup treatments (history)
      tags: [Treatments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Appointment_ID:
                  type: string
                Patient_ID:
                  type: string
                Doctor_ID:
                  type: string
      responses:
        "200":
          description: Treatment history returned
          content:
            application/json:
              schema:
                description: Treatment Lookup Response
                type: object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    treatment_details:
                      type: array
                      items: 
                        $ref: '#/components/schemas/TreatmentCreate'
                  
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/update:
    post:
      summary: Update treatment
      tags: [Treatments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentUpdate'
      responses:
        "200":
          description: Treatment updated
          content:
            application/json:
              schema:
                description : Updated Treatment Details
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
                    
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/delete:
    delete:
      summary: Delete treatment record
      tags: [Treatments]
      security:
        - JWT: []
      parameters:
        - in: query
          name: Appointment_ID
          description: Delete by Appointment_ID
          required: false
          schema:
            type: string
            
      responses:
        "200":
          description: Treatment deleted
          content:
            application/json:
              schema:
                description: Treatment Deletion Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Appointment_ID:
                      type: string
                
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/create:
    post:
      summary: Create department
      tags: [Departments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        "200":
          description: Department created
          content:
            application/json:
              schema:
                description : Department Creation Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Dept_ID:
                      type: string
                
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/lookup:
    get:
      summary: Lookup departments
      tags: [Departments]
      security:
        - JWT: []
      parameters:
        - name: Dept_ID
          in: query
          schema:
            type: string
        - name: Speciality
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Departments list
          content:
            application/json:
              schema:
                description: Department Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    department_details : 
                      type : array
                      items:
                        $ref: '#/components/schemas/DepartmentCreate'

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/delete:
    delete:
      summary: Delete department
      tags: [Departments]
      security:
        - JWT: []
      parameters:
        - in: query
          name: Dept_ID
          description: Delete by Dept_ID
          required: false
          schema:
            type: string
            
      responses:
        "200":
          description: Department deleted
          content:
            application/json:
              schema:
                description: Department Deletion Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Dept_ID:
                      type: string 
            
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/assign:
    post:
      summary: Add doctor to department
      tags: [DoctorDept]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorDeptAdd'
      responses:
        "200":
          description: Doctor added to department
          content:
            application/json:
              schema:
                description : Add doctor to Department Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    doctordeptobj:
                      $ref: '#/components/schemas/DoctorDeptResponse'
              
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/doctor-lookup: 
    get:
      summary: Lookup doctor-department relations
      tags: [DoctorDept]
      security:
        - JWT: []
      parameters:
        - name: First_Name
          in: query
          schema:
            type: string
        - name: Last_Name
          in: query
          schema:
            type: string
        - name: Speciality
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relations returned
          content:
            application/json:
              schema:
                description: Doctor-Department Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    doctordept_details:
                      type: array
                      items: 
                        $ref: '#/components/schemas/DoctorDeptAdd'
               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/unassign: 
    delete:
      summary: Remove doctor from department or delete department (based on payload)
      tags: [DoctorDept]
      security:
        - JWT: []
      parameters:
        - in: query
          name: Dept_ID
          description: Delete by Dept_ID
          required: false
          schema:
            type: string
        - in: query
          name: Doctor_ID
          description: Delete by Doctor_ID
          required: false
          schema:
            type: string
            
      responses:
        "200":
          description: Deletion successful
          content:
            application/json:
              schema:
                description : Doctor-Department Deletion Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'  
                    Doctor_ID:
                      type: string
                  
               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/create:
    post:
      summary: Create doctor's weekly slots
      tags: [Slots]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotsObj'
      responses:
        "200":
          description: Slots created
          content:
            application/json:
              schema:
                description: Slots Creation Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    Doctor_ID:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/lookup:
    post:
      summary: Lookup doctor's slots (POST as per draft)
      tags: [Slots]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Doctor_ID:
                  type: string
      responses:
        "200":
          description: Slots returned
          content:
            application/json:
              schema:
                description: Slots Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'     
                    slots_details:
                      $ref: '#/components/schemas/SlotsObj' 
              
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/update:
    post:
      summary: Update doctor's slots
      tags: [Slots]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotsUpdate'
      responses:
        "200":
          description: Slots updated
          content:
            application/json:
              schema:
                description : Updated Slots Details
                type : object 
                properties:  
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    slotsObj:
                      $ref: '#/components/schemas/SlotsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/availability:
    get:
      summary: Find doctors by availability
      tags: [Slots]
      security:
        - JWT: []
      parameters:
        - name: Doctor_ID
          in: query
          schema:
            type: string
        - name: Appointment_Date 
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Doctors matching availability
          content:
            application/json:
              schema:
                description: Doctor Availability Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'   
                    available_doctors:
                      $ref: '#/components/schemas/FreeSlotsObj'
                      
               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    JWT:
      type: apiKey
      in: header
      name: Authorization
      description: JWT token. Include in the Authorization header as  "Authorization <JWT>"

  schemas:
    LoginCred:
      type: object
      required:
        - User_ID 
        - Password
      properties:
        User_ID:
          type: string
        Password:
          type: string

    API-Status:
      type: string
      enum: [success, error]
        

    # Users
    UserCreate:
      type: object
      required:
        - First_Name
        - User_Type
        - Phone_Number
        - Password
      properties:
        First_name:
          type: string
        Last_Name:
          type: string
        User_Type:
          type: string
          enum: [ADMIN, PATIENT, DOCTOR]
        Phone_Number:
          type: string
        User_Profile:
          type: string
        Password:
          type: string
        
    UserUpdate:
      type: object
      required: [User_ID]
      properties:
        User_ID:
          type: string
        First_Name:
          type: string
        Last_Name:
          type: string
        Phone_Number:
          type: string
        User_Profile:
          type: string
        Password: 
          type: string
    
    UserResponse:
      type: object
      properties:
        User_ID:
          type: string
        First_Name:
          type: string
        Last_Name:
          type: string
        User_Type:
          type: string
        Phone_Number:
          type: string
        User_Profile:
          type: string

    # Appointments
    AppointmentCreate:
      type: object
      required:
        - Patient_ID
        - Doctor_ID
        - Appointment_Date
        - Appointment_Time
      properties:
        Patient_ID:
          type: string
        Doctor_ID:
          type: string
        Appointment_Date:
          type: string
          description: "Date in DD/MM/YY or ISO format"
        Appointment_Time:
          type: string
          description: "Time in HH:MM"
    AppointmentUpdate:
      type: object
      required:
        - Appointment_ID
      properties:
        Appointment_ID:
          type: string
        Appointment_Status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
    
  

    # Treatments
    TreatmentCreate:
      type: object
      required:
        - Appointment_ID
      properties:
        Appointment_ID:
          type: string
        Diagnosis:
          type: string
        Prescription:
          type: string
        Notes:
          type: string
    TreatmentUpdate:
      type: object
      required:
        - Appointment_ID
      properties:
        Appointment_ID:
          type: string
        Patient_ID:
          type: string
        Diagnosis:
          type: string
        Prescription:
          type: string
        Notes:
          type: string
  
    # Departments & Doctor_Dept
    DepartmentCreate:
      type: object
      required: [Speciality]
      properties:
        Dept_ID:
          type: string
        Speciality:
          type: string
        Details:
          type: string
   
    DoctorDeptAdd:
      type: object
      required: [Doctor_ID, Dept_ID]
      properties:
        Doctor_ID:
          type: string
        Dept_ID:
          type: string
        Dept_Position: 
          type: string 
          enum: ['HOD','CONSULTANT','RESIDENT']
   
    DoctorDeptResponse:
      type: object
      properties:
        Doctor_ID: { type: string }
        Dept_ID: { type: string }

    # Slots
    SlotsObj:
      type: object
      required: [Doctor_ID, Days_Available, Time_Slots]
      properties:
        Doctor_ID:
          type: string
        Days_Available:
          type: string
          description: "E.g. Mon-Fri, or comma-separated days"
        Time_Slots:
          type: string
          description: "E.g. 09:00-11:00,13:00-15:00"
    FreeSlotsObj:
      type: object
      required: [Doctor_ID,Appointment_Date, Free_Slots]
      properties:
        Doctor_ID:
          type: string
        Appointment_Date:
          type: string
          description: "Date of appointment"
        Free_Slots:
          type: array
          description: "E.g. [09:00,9:15]"
          example: ["10:00", "11:15"]
          items:
            type: string
            
    SlotsUpdate:
      type: object
      required: [Doctor_ID]
      properties:
        Doctor_ID:
          type: string
        Days_Available:
          type: string
        Time_Slots:
          type: string
    SlotsResponse:
      type: object
      properties:
        Doctor_ID: { type: string }
        Days_Available: { type: string }
        Time_Slots: { type: string }

  
   
    Error:
      type: object
      properties:
        status : 
            $ref: '#/components/schemas/API-Status'
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request - validation / missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         
    Unauthorized:
      description: Unauthorized - missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         
    Forbidden:
      description: Forbidden - role not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         

