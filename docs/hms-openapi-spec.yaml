openapi: 3.0.3
info:
  title: HMS (Hospital Management System) API
  version: "1.0.0"
  description: |
    OpenAPI specification for the HMS endpoints described in the uploaded draft.
    Authentication uses an apiKey-style JWT passed in the Authorization header as "Bearer <token>".
  x-source-file: "/mnt/data/rough-api-2.txt"
servers:
  - url: http://localhost:9000
    description: Local development

# Global security requirement: JWT apiKey in Authorization header
security:
  - JWT: []

paths:
  /hms/id/generate/token:
    post:
      summary: Generate a JWT for a user
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCred'
      responses:
        "200":
          description: JWT created successfully
          content:
            application/json:
              schema:
                description: JWT Generation Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    token: 
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/create:
    post:
      summary: Create a new user
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "200":
          description: User created successfully
          content:
            application/json:
              schema:
                description: User Create Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    user_id: 
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/lookup:
    get:
      summary: Lookup user details
      tags: [Users]
      security:
        - JWT: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: email_id
          in: query
          schema:
            type: string
        - name: phone_number
          in: query
          schema:
            type: string
        - name: first_name
          in: query
          schema:
            type: string
        - name: last_name
          in: query
          schema:
            type: string
        - name: user_type
          in: query
          schema:
            type: string
            enum: [PATIENT, DOCTOR]
      responses:
        "200":
          description: Found users / user details
          content:
            application/json:
              schema:
                description : User Lookup Response
                type: object 
                properties:
                  status: 
                    $ref: '#/components/schemas/API-Status'
                  user_details:
                    type : array
                    items : 
                      $ref: '#/components/schemas/UserResponse'

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/update:
    post:
      summary: Update user details
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                description: Updated User Details
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    user_id:
                      type: string
  
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/check-password:
    post:
      summary: Check password validity
      tags: [Users]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - password
              properties:
                user_id:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: User password check success
          content:
            application/json:
              schema:
                description: Password Check Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    user_id:
                      type: string
  
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/user/delete:
    delete:
      summary: Delete a user (and related data)
      tags: [Users]
      security:
        - JWT: []
      parameters:
        - in: query
          name: user_id
          description: Delete by User_ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                description: User Deletion Response 
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    user_id :
                      type: string 
             
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointment/create:
    post:
      summary: Create appointment
      tags: [Appointments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        "200":
          description: Appointment created
          content:
            application/json:
              schema:
                description: Appointment Create Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_id:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointments/lookup:
    get:
      summary: Lookup appointments
      tags: [Appointments]
      security:
        - JWT: []
      parameters:
        - name: appointment_id
          in: query
          schema:
            type: string
        - name: patient_id
          in: query
          schema:
            type: string
        - name: doctor_id
          in: query
          schema:
            type: string
        - name: appointment_date
          in: query
          schema:
            type: string
        - name: appointment_status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, COMPLETED, CANCELLED, ALL]
      responses:
        "200":
          description: Appointment(s) returned
          content:
            application/json:
              schema:
                description: Appointment Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_details : 
                      type: array 
                      items: 
                        $ref: '#/components/schemas/AppointmentLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/appointment/update:
    put:
      summary: Update appointment
      tags: [Appointments]
      security:
        - JWT: []
      parameters:
        - name: appointment_id
          in: query
          schema:
            type: string
        - name: appointment_status
          in: query
          schema:
            type: string
            enum: [COMPLETED, CANCELLED]
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                description : Updated Appointment Details
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_id:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/upload:
    post:
      summary: Upload treatment (diagnosis/prescription)
      tags: [Treatments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentCreate'
      responses:
        "200":
          description: Treatment uploaded
          content:
            application/json:
              schema:
                description: Treatment Upload Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_id:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/lookup:
    get:
      summary: Lookup treatments (history)
      tags: [Treatments]
      security:
        - JWT: []
      parameters:
        - name: patient_id
          in: query
          schema:
            type: string
        - name: doctor_id
          in: query
          schema:
            type: string
        - name: appointment_id
          in: query
          schema:
            type: string
        - name : appointment_date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Treatment history returned
          content:
            application/json:
              schema:
                description: Treatment Lookup Response
                type: object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    treatment_details:
                      type: array
                      items: 
                        $ref: '#/components/schemas/TreatmentLookup'
                  
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/treatments/update:
    post:
      summary: Update treatment
      tags: [Treatments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentUpdate'
      responses:
        "200":
          description: Treatment updated
          content:
            application/json:
              schema:
                description : Updated Treatment Details
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    appointment_id:
                      type: string
                    
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/create:
    post:
      summary: Create department
      tags: [Departments]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        "200":
          description: Department created
          content:
            application/json:
              schema:
                description : Department Creation Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    dept_id:
                      type: string
                
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/lookup:
    get:
      summary: Lookup departments
      tags: [Departments]
      security:
        - JWT: []
      parameters:
        - name: dept_id
          in: query
          schema:
            type: string
        - name: speciality
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Departments list
          content:
            application/json:
              schema:
                description: Department Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    department_details : 
                      type : array
                      items:
                        $ref: '#/components/schemas/DepartmentCreate'

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/delete:
    delete:
      summary: Delete department
      tags: [Departments]
      security:
        - JWT: []
      parameters:
        - in: query
          name: dept_id
          description: Delete by Dept_ID
          required: false
          schema:
            type: string
            
      responses:
        "200":
          description: Department deleted
          content:
            application/json:
              schema:
                description: Department Deletion Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    dept_id:
                      type: string 
            
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/assign:
    post:
      summary: Add doctor to department
      tags: [DoctorDept]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorDeptAdd'
      responses:
        "200":
          description: Doctor added to department
          content:
            application/json:
              schema:
                description : Add doctor to Department Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    doctor_id:
                      type: string
                    dept_id:
                      type: string
                      
              
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/doctor-lookup: 
    get:
      summary: Lookup doctor-department relations
      tags: [DoctorDept]
      security:
        - JWT: []
      parameters:
        - name: first_name
          in: query
          schema:
            type: string
        - name: last_name
          in: query
          schema:
            type: string
        - name: specialities
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relations returned
          content:
            application/json:
              schema:
                description: Doctor-Department Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    doctordept_details:
                      type: array
                      items: 
                        $ref: '#/components/schemas/DoctorDeptAdd'
               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/departments/unassign: 
    delete:
      summary: Remove doctor from department or delete department (based on payload)
      tags: [DoctorDept]
      security:
        - JWT: []
      parameters:
        - in: query
          name: dept_id
          description: Delete by Dept_ID
          required: false
          schema:
            type: string
        - in: query
          name: doctor_id
          description: Delete by Doctor_ID
          required: false
          schema:
            type: string
            
      responses:
        "200":
          description: Deletion successful
          content:
            application/json:
              schema:
                description : Doctor-Department Deletion Response
                type : object 
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'  
                    doctor_id:
                      type: string
                  
               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/create:
    post:
      summary: Create doctor's weekly slots
      tags: [Slots]
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotsObj'
      responses:
        "200":
          description: Slots created
          content:
            application/json:
              schema:
                description: Slots Creation Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'
                    doctor_id:
                      type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/lookup:
    get:
      summary: Lookup doctor's slots (POST as per draft)
      tags: [Slots]
      security:
        - JWT: []
      parameters:
        - name: doctor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Slots returned
          content:
            application/json:
              schema:
                description: Slots Lookup Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'     
                    slots_details:
                      $ref: '#/components/schemas/SlotsResponse'               
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

  /hms/slots/availability:
    get:
      summary: Find doctors by availability
      tags: [Slots]
      security:
        - JWT: []
      parameters:
        - name: doctor_id
          in: query
          schema:
            type: string
        - name: appointment_date 
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Doctors matching availability
          content:
            application/json:
              schema:
                description: Doctor Availability Response
                type: object
                properties:
                    status: 
                      $ref: '#/components/schemas/API-Status'   
                    free_slots:
                      type: array
                      items: 
                        type: string

        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    JWT:
      type: apiKey
      in: header
      name: Authorization
      description: JWT token. Include in the Authorization header as  "Authorization <JWT>"

  schemas:
    LoginCred:
      type: object
      required:
        - user_id
        - password
      properties:
        user_id:
          type: string
        password:
          type: string

    API-Status:
      type: string
      enum: [success, error]
        

    # Users
    UserCreate:
      type: object
      required:
        - sex
        - first_name
        - user_type
        - phone_number
        - password
        - date_of_birth
        - address
      properties:
        first_name:
          type: string
        email_id:
          type: string
        sex:
          type: string
          enum: [M, F, O]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        last_name:
          type: string
        user_type:
          type: string
          enum: [ADMIN, PATIENT, DOCTOR]
        phone_number:
          type: string
        user_profile:
          type: object
        password:
          type: string
        
    UserUpdate:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        email_id:
          type: string
        sex:
          type: string
          enum: [M, F, O]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        user_profile:
          type: object
        password: 
          type: string
    
    UserResponse:
      type: object
      properties:
        User_ID:
          type: string
        Email_ID:
          type: string
        Sex:
          type: string
        Date_Of_Birth:
          type: string
          format: date
        Address:
          type: string
        First_Name:
          type: string
        Last_Name:
          type: string
        User_Type:
          type: string
        Phone_Number:
          type: string
        User_Profile:
          type: object

    # Appointments
    AppointmentCreate:
      type: object
      required:
        - patient_id
        - doctor_id
        - appointment_date
        - appointment_time
      properties:
        patient_id:
          type: string
        doctor_id:
          type: string
        appointment_date:
          type: string
          description: "Date in DD/MM/YY or ISO format"
        appointment_time:
          type: string
          description: "Time in HH:MM"
        appointment_status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
    
    AppointmentLookup:
      type: object
      required:
        - patient_id
        - doctor_id
        - appointment_date
        - appointment_tme
      properties:
        patient_id:
          type: string
        patient_first_name:
          type: string
        patient_last_name:
          type: string
        doctor_id:
          type: string
        doctor_first_name:
          type: string
        doctor_last_name:
          type: string
        specialities:
          type: string
        appointment_date:
          type: string
          description: "Date in DD/MM/YY or ISO format"
        appointment_time:
          type: string
          description: "Time in HH:MM"
        appointment_status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]

    
    # Treatments
    TreatmentCreate:
      type: object
      required:
        - appointment_id
        - notes
      properties:
        appointment_id:
          type: string
        diagnosis:
          type: string
        prescription:
          type: string
        notes:
          type: string

    TreatmentUpdate:
      type: object
      required:
        - appointment_id
      properties:
        appointment_id:
          type: string
        diagnosis:
          type: string
        prescription:
          type: string
        notes:
          type: string
  
    TreatmentLookup:
      type: object
      required:
        - appointment_id
        - notes
      properties:
        appointment_id:
          type: string
        appointment_date:
          type: string
        diagnosis:
          type: string
        prescription:
          type: string
        notes:
          type: string
        doctor_id:
          type: string
        doctor_first_name:
          type: string
        doctor_last_name:
          type: string
        patient_id:
          type: string
        patient_first_name:
          type: string
        patient_last_name:
          type: string
        specialities:
          type: string

    # Departments & Doctor_Dept
    DepartmentCreate:
      type: object
      required: [speciality]
      properties:
        speciality:
          type: string
        details:
          type: string
   
    DoctorDeptAdd:
      type: object
      required: [doctor_id, dept_id, dept_position]
      properties:
        doctor_id:
          type: string
        dept_id:
          type: string
        dept_position: 
          type: string 
          enum: ['HOD','CONSULTANT','RESIDENT']
  
    # Slots
    SlotsObj:
      type: object
      required: [doctor_id, days_available,start_date, end_date]
      properties:
        doctor_id:
          type: string
        days_available:
          type: array
          description: "E.g. Mon-Fri, or comma-separated days"
          items:
            type: string
        start_date:
          type: string
          description: "Start date for the slots"
          format: YYYY-MM-DD
        end_date:
          type: string
          description: "End date for the slots"
          format: YYYY-MM-DD

            
    SlotsResponse:
      type: object
      properties:
        doctor_id: { type: string }
        days_available: { type: string }

    Error:
      type: object
      properties:
        status : 
            $ref: '#/components/schemas/API-Status'
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request - validation / missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         
    Unauthorized:
      description: Unauthorized - missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         
    Forbidden:
      description: Forbidden - role not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
         

